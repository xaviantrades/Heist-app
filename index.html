<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Loading...</title> <style> @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400; src: url("../fonts/dm-sans-400.woff2") format("woff2"); } @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 500; src: url("../fonts/dm-sans-500.woff2") format("woff2"); } @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 600; src: url("../fonts/dm-sans-600.woff2") format("woff2"); } * { box-sizing: border-box; margin: 0; padding: 0; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #ffffff; font-family: "DM Sans", sans-serif; color: #111111; overflow: hidden; } .loader-container { width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; } /* Animated spiral */ .spiral { width: 70px; height: 70px; position: relative; margin-bottom: 28px; } .spiral::before, .spiral::after { content: ""; position: absolute; inset: 5px; border: 3px solid transparent; border-top-color: #111111; border-right-color: #111111; border-radius: 50%; animation: spin 1.1s linear infinite; } .spiral::after { inset: 15px; border-width: 2px; border-top-color: #777777; border-right-color: #777777; animation-direction: reverse; animation-duration: 0.8s; } @keyframes spin { to { transform: rotate(360deg); } } .loading-text { font-size: 16px; font-weight: 500; letter-spacing: 0.2px; margin-bottom: 8px; } .sub-text { font-size: 13px; color: #777777; margin-bottom: 18px; } .countdown { font-size: 13px; color: #999999; } .countdown span { font-weight: 600; color: #111111; } /* Small animated dots */ .dots::after { content: ""; animation: dots 1.5s infinite; } @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } 100% { content: ""; } } </style> </head> <body> <div class="loader-container"> <div class="spiral"></div> <div class="loading-text"> Loading<span class="dots"></span> </div> <div class="sub-text"> Preparing your experience </div> <div class="countdown"> Redirecting in <span id="timer">5</span>s </div> </div> <script> let seconds = 5; const timer = document.getElementById("timer"); const countdown = setInterval(() => { seconds--; timer.textContent = seconds; if (seconds <= 0) { clearInterval(countdown); window.location.href = "home.html"; } }, 1000); </script> </body> </html>
